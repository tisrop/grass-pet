name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -C debuginfo=line-tables-only

jobs:
  frontend:
    name: Frontend, contracts, QA, and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check version and Tauri project contracts
        run: |
          node .github/checks/version-consistency.mjs
          pnpm run check:frontend
          node tools/validate-tauri-contract.mjs
          node tools/validate-spec.mjs
          node tools/validate-asset-links.mjs
          node tools/qa-ui.mjs
          node tools/qa-experience.mjs
          node tools/qa-assets.mjs

      - name: Unit tests
        run: pnpm test

      - name: Build Vue frontend
        run: pnpm run vue:build

  rust:
    name: Rust format, Clippy, and tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/.ghcup || true
          docker system prune -af || true

      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ci-rust

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test --all --locked

  rust-platform-check:
    name: Rust check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.96.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ci-rust-platform-${{ matrix.os }}

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --all-targets --locked

  tauri-e2e:
    name: Tauri E2E (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: dtolnay/rust-toolchain@1.96.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ci-tauri-e2e

      - run: pnpm install --frozen-lockfile

      - name: Build and run embedded WebdriverIO suite
        run: pnpm run test:e2e
