name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to publish
        required: true
        type: string
      repair_existing:
        description: Rebuild and replace assets in an existing published release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  RUSTFLAGS: -C debuginfo=line-tables-only

jobs:
  verify:
    name: Verify release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify tag and manifests
        run: |
          node .github/checks/version-consistency.mjs --tag "$RELEASE_TAG"
          pnpm run lint
          pnpm run fmt:check
          pnpm run preflight

  prepare-release:
    name: Prepare draft release
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.release.outputs.release-id }}
    steps:
      - name: Create or reset draft release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPAIR_EXISTING="${{ github.event_name == 'workflow_dispatch' && inputs.repair_existing || false }}"

          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq -s 'add // []' > "$RUNNER_TEMP/releases.json"

          MATCH_COUNT="$(jq --arg tag "$RELEASE_TAG" \
            '[.[] | select(.tag_name == $tag)] | length' \
            "$RUNNER_TEMP/releases.json")"
          if [ "$MATCH_COUNT" -gt 1 ]; then
            echo "Multiple releases found for tag $RELEASE_TAG; refusing an ambiguous update" >&2
            exit 1
          fi

          if [ "$MATCH_COUNT" -eq 1 ]; then
            jq --arg tag "$RELEASE_TAG" \
              '.[] | select(.tag_name == $tag)' \
              "$RUNNER_TEMP/releases.json" > "$RUNNER_TEMP/release.json"
            RELEASE_ID="$(jq -r '.id' "$RUNNER_TEMP/release.json")"
            if [ "$(jq -r '.draft' "$RUNNER_TEMP/release.json")" != "true" ]; then
              if [ "$REPAIR_EXISTING" != "true" ]; then
                echo "Release $RELEASE_TAG is already published; set repair_existing=true for an explicit asset repair" >&2
                exit 1
              fi
              echo "Repairing published release $RELEASE_TAG without deleting old assets until new assets pass validation"
            else
              gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" \
                | jq -s 'add // []' > "$RUNNER_TEMP/assets.json"
              while read -r ASSET_ID; do
                [ -n "$ASSET_ID" ] && gh api --method DELETE \
                  "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}"
              done < <(jq -r '.[].id' "$RUNNER_TEMP/assets.json")
            fi
          else
            jq -n \
              --arg tag "$RELEASE_TAG" \
              --arg name "阿飘道长桌宠 ${RELEASE_TAG}" \
              '{
                tag_name: $tag,
                name: $name,
                draft: true,
                prerelease: false,
                generate_release_notes: true
              }' > "$RUNNER_TEMP/create-release.json"
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/releases" \
              --input "$RUNNER_TEMP/create-release.json" \
              > "$RUNNER_TEMP/release.json"
            RELEASE_ID="$(jq -r '.id' "$RUNNER_TEMP/release.json")"
          fi

          if ! [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]; then
            echo "Invalid draft release ID: $RELEASE_ID" >&2
            exit 1
          fi
          echo "release-id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          - name: macOS x64
            platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
          # Linux AppImage/DEB builds are temporarily disabled.
          # Re-enable this matrix entry together with the Linux requirement in
          # .github/checks/release-assets.mjs when Linux packaging resumes.
          - name: Windows x64 (NSIS)
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-${{ matrix.target }}
          cache-on-failure: true

      - name: Require updater signing key
        shell: bash
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$UPDATER_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is required to publish updater artifacts" >&2
            exit 1
          fi

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Use ad-hoc signing on macOS
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile

      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release-id }}
          tagName: ${{ env.RELEASE_TAG }}
          uploadUpdaterJson: false
          # GitHub sanitizes non-ASCII asset names in the downloadable URL.
          # Keep the app/product name Chinese inside the installers, but use a
          # stable ASCII name for Release assets themselves.
          releaseAssetNamePattern: "grass-pet_[version]_[arch][setup][ext]"
          args: ${{ matrix.args }}

  assemble-updater-metadata:
    name: Assemble updater metadata
    needs: [prepare-release, build]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Fetch Release and updater signatures
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release-id }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > "$RUNNER_TEMP/release.json"
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" \
            | jq -s 'add // []' > "$RUNNER_TEMP/release-assets.json"
          mkdir -p "$RUNNER_TEMP/updater-signatures"
          while IFS=$'\t' read -r ASSET_ID ASSET_NAME; do
            gh api -H 'Accept: application/octet-stream' \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" \
              > "$RUNNER_TEMP/updater-signatures/${ASSET_NAME}"
          done < <(jq -r '.[] | select(.name | endswith(".sig")) | [.id, .name] | @tsv' "$RUNNER_TEMP/release-assets.json")

      - name: Generate one merged latest.json
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          node .github/checks/generate-updater-metadata.mjs \
            --assets "$RUNNER_TEMP/release-assets.json" \
            --release "$RUNNER_TEMP/release.json" \
            --signatures-dir "$RUNNER_TEMP/updater-signatures" \
            --repository "$RELEASE_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --output "$RUNNER_TEMP/latest.json"

      - name: Replace draft latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release-id }}
        run: |
          set -euo pipefail
          while read -r ASSET_ID; do
            [ -n "$ASSET_ID" ] && gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}"
          done < <(jq -r '.[] | select(.name == "latest.json") | .id' "$RUNNER_TEMP/release-assets.json")

          RELEASE_UPLOAD_URL="$(jq -r '.upload_url' "$RUNNER_TEMP/release.json")"
          RELEASE_UPLOAD_URL="${RELEASE_UPLOAD_URL%\{?name,label\}}"
          gh api --method POST \
            -H 'Content-Type: application/octet-stream' \
            "${RELEASE_UPLOAD_URL}?name=latest.json" \
            --input "$RUNNER_TEMP/latest.json"

  release-smoke:
    name: Validate draft release assets
    needs: [prepare-release, build, assemble-updater-metadata]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Fetch draft release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release-id }}
        run: |
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" \
            | jq -s 'add // []' > "$RUNNER_TEMP/release-assets.json"
          LATEST_ID="$(jq -r '[.[] | select(.name == "latest.json")] | if length == 1 then .[0].id else empty end' "$RUNNER_TEMP/release-assets.json")"
          if [ -z "$LATEST_ID" ]; then
            echo "Draft Release must contain exactly one latest.json" >&2
            exit 1
          fi
          gh api -H 'Accept: application/octet-stream' \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${LATEST_ID}" \
            > "$RUNNER_TEMP/latest.json"

      - name: Validate platform artifacts and updater metadata
        run: node .github/checks/release-assets.mjs "$RUNNER_TEMP/release-assets.json" "$RELEASE_TAG" "$RUNNER_TEMP/latest.json"

  cleanup-release-assets:
    name: Remove obsolete Release asset names
    needs: [prepare-release, release-smoke]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Remove non-ASCII downloadable asset names
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release-id }}
        run: |
          set -euo pipefail
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" \
            | jq -s 'add // []' > "$RUNNER_TEMP/release-assets.json"
          while IFS=$'\t' read -r ASSET_ID ASSET_NAME; do
            case "$ASSET_NAME" in
              grass-pet_*|latest.json) ;;
              *)
                echo "Deleting obsolete Release asset: $ASSET_NAME"
                gh api --method DELETE \
                  "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}"
                ;;
            esac
          done < <(jq -r '.[] | [.id, .name] | @tsv' "$RUNNER_TEMP/release-assets.json")

  publish:
    name: Publish GitHub Release
    needs: [prepare-release, release-smoke, cleanup-release-assets]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest
