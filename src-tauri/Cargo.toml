[package]
name = "grass-pet-tauri"
version = "1.1.0"
description = "Tauri shell for 阿飘道长桌宠"
authors = ["Desktop Pet Builder User"]
edition = "2021"

[lib]
name = "grass_pet_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2.10.1"
tauri-plugin-wdio = { version = "1.3.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.3.0", optional = true }
uuid = { version = "1", features = ["v4"] }

[features]
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]
